server.port=8080

# Load optional local overrides (email credentials). Copy application-local.properties.example first.
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/studyflow_db
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# 'update' keeps registered users/tasks/exams between restarts (was 'create', which wiped them).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration (Gmail)
# Set these as environment variables before starting the backend - do NOT hard-code secrets here.
#   MAIL_USERNAME = your full Gmail address (e.g. you@gmail.com)
#   MAIL_PASSWORD = a Google "App Password" (16 chars), NOT your normal Gmail password.
# How to get an App Password: Google Account > Security > 2-Step Verification (on) > App passwords.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Daily email digest (8:00 AM server time). Set enabled=false to turn off.
studyflow.reminders.enabled=true
studyflow.reminders.cron=0 0 8 * * *
